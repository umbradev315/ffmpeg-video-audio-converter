id: io.github.edneyosf.ffmpeg-video-audio-converter
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: ffmpeg-video-audio-converter
finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=x11
  - --filesystem=home
  - --share=network
modules:
  - name: ffmpeg-video-audio-converter
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/openjdk21/bin
      env:
        - JAVA_HOME=/usr/lib/sdk/openjdk21/jvm/openjdk-21
        - GRADLE_USER_HOME=/run/build/ffmpeg-video-audio-converter
      secret-env:
        - GITHUB_ACTOR
        - GITHUB_TOKEN
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh
      - ./gradlew composeApp:createReleaseDistributable
      - cp -r ./composeApp/build/compose/binaries/main-release/app/ffmpeg-video-audio-converter/* $FLATPAK_DEST/
      - install -Dm644 ./scripts/metadata/io.github.edneyosf.ffmpeg-video-audio-converter.desktop /app/share/applications/io.github.edneyosf.ffmpeg-video-audio-converter.desktop
      - install -Dm644 ./assets/io.github.edneyosf.ffmpeg-video-audio-converter.png /app/share/icons/hicolor/256x256/apps/io.github.edneyosf.ffmpeg-video-audio-converter.png
      - install -Dm644 ./scripts/metadata/io.github.edneyosf.ffmpeg-video-audio-converter.metainfo.xml /app/share/metainfo/io.github.edneyosf.ffmpeg-video-audio-converter.metainfo.xml
    sources:
      - type: dir
        path: ../../